services:
  postgres:
    image: postgres:17

    container_name: postgresql-development-lab

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgresql_development_lab

    ports:
      - "5432:5432"

    volumes:
      - development_lab_data:/var/lib/postgresql/data

volumes:
  development_lab_data: